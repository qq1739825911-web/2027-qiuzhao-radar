<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027秋招雷达</title><style>body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033}.top{background:#111827;color:white;padding:18px 5%;font-size:22px;font-weight:800}.top span{color:#a78bfa}.hero{padding:48px 5%;background:linear-gradient(135deg,#151a2e,#4c1d95);color:white}.hero h1{font-size:38px;margin:0 0 12px}.wrap{max-width:1400px;margin:-20px auto 50px;padding:0 18px}.panel{background:white;border:1px solid #e5e9f0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px rgba(18,28,45,.06)}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px}.input,.select,button{padding:11px;border:1px solid #d8dee8;border-radius:9px;background:white}.primary{background:#5b5ce2;color:white}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border-radius:99px;background:#f1f3f7;cursor:pointer;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid #e5e9f0;text-align:left;font-size:13px}th{background:#fafbfc}.pill{background:#ede9fe;color:#6d28d9;padding:4px 7px;border-radius:6px}.fav{border:0;font-size:20px;cursor:pointer;background:transparent}.source{color:#4f46e5}.note{font-size:12px;line-height:1.6;background:#fff7ed;color:#9a3412;padding:11px;border-radius:9px;margin-bottom:12px}@media(max-width:800px){.filters{grid-template-columns:1fr}.hero h1{font-size:29px}}</style></head><body><div class="top">2027<span>秋招雷达</span></div><section class="hero"><h1>把秋招信息，变成可筛选的机会。</h1><p>AI / AIGC / 产品 / 运营 / 设计 / 技术 / 电商 / 金融 / 制造 / 国企央企 / 中小企业，全专业招聘信息聚合。</p></section><main class="wrap"><div class="panel"><div class="filters"><input id="q" class="input" placeholder="搜索公司、岗位、技能"><select id="cat" class="select"><option value="">全部岗位类别</option></select><select id="city" class="select"><option value="">全部城市</option></select><select id="type" class="select"><option value="">全部企业类型</option></select></div><div id="chips" class="chips"></div></div><div class="panel"><div class="note">V1.0 Beta：当前包含公开招聘入口与演示岗位。正式版将接入经授权的数据源，并保留来源、发布时间、最后核验时间和原始链接。</div><div class="table"><table><thead><tr><th>公司 / 岗位</th><th>类别</th><th>城市</th><th>企业类型</th><th>更新时间</th><th>来源</th><th>收藏</th></tr></thead><tbody id="list"></tbody></table></div></div></main><script>const jobs=[{id:1,c:"牛客",p:"AI产品 / 产品运营 / AI应用",cat:"产品 / 运营",city:"全国",type:"互联网/科技",date:"2026-10-08",s:"牛客",u:"https://www.nowcoder.com/",k:"AI 产品 大模型 运营"},{id:2,c:"应届生求职网",p:"AIGC / 新媒体 / 运营 / 设计",cat:"内容 / 新媒体",city:"全国",type:"综合企业",date:"2026-10-08",s:"应届生求职网",u:"https://www.yingjiesheng.com/",k:"新媒体 抖音 小红书 AIGC"},{id:3,c:"BOSS直聘",p:"AI / 运营 / 电商 / 设计 / 技术",cat:"综合岗位",city:"全国",type:"综合企业",date:"2026-10-08",s:"BOSS直聘",u:"https://www.zhipin.com/",k:"AI 运营 电商 产品 设计"},{id:4,c:"示例科技公司",p:"AI产品运营（演示）",cat:"产品 / 运营",city:"杭州",type:"民营/中型企业",date:"2026-10-07",s:"演示数据",u:"#",k:"AI 产品运营 数据分析"},{id:5,c:"示例品牌公司",p:"AI新媒体运营（演示）",cat:"内容 / 新媒体",city:"上海",type:"民营/中小企业",date:"2026-10-07",s:"演示数据",u:"#",k:"AI 新媒体 短视频"},{id:6,c:"示例视觉公司",p:"AIGC视觉设计师（演示）",cat:"设计 / 视觉",city:"广州",type:"民营/小型企业",date:"2026-10-05",s:"演示数据",u:"#",k:"视觉 AIGC 平面 品牌"},{id:7,c:"示例软件公司",p:"AI应用开发（演示）",cat:"技术 / 开发",city:"深圳",type:"创业公司",date:"2026-10-04",s:"演示数据",u:"#",k:"Python AI Agent"}];let fav=JSON.parse(localStorage.getItem("radar_fav")||"[]");const cats=[...new Set(jobs.map(x=>x.cat))],cities=[...new Set(jobs.map(x=>x.city))],types=[...new Set(jobs.map(x=>x.type))];cat.innerHTML+=cats.map(x=>"<option>"+x+"</option>").join("");city.innerHTML+=cities.map(x=>"<option>"+x+"</option>").join("");type.innerHTML+=types.map(x=>"<option>"+x+"</option>").join("");chips.innerHTML=cats.map(x=>"<span class="chip" onclick="cat.value='"+x+"';render()">"+x+"</span>").join("");function render(){let qv=q.value.toLowerCase(),a=jobs.filter(x=>(!qv||(x.c+x.p+x.cat+x.k).toLowerCase().includes(qv))&&(!cat.value||x.cat==cat.value)&&(!city.value||x.city==city.value)&&(!type.value||x.type==type.value));list.innerHTML=a.map(x=>"<tr><td><b>"+x.c+"</b><br>"+x.p+"<br><small>"+x.k+"</small></td><td><span class="pill">"+x.cat+"</span></td><td>"+x.city+"</td><td>"+x.type+"</td><td>"+x.date+"</td><td><a class="source" href=""+x.u+"" target="_blank">"+x.s+"</a></td><td><button class="fav" onclick="toggle("+x.id+")">"+(fav.includes(x.id)?"★":"☆")+"</button></td></tr>").join("")||"<tr><td colspan="7">没有匹配岗位</td></tr>"}function toggle(id){fav=fav.includes(id)?fav.filter(x=>x!=id):fav.concat(id);localStorage.setItem("radar_fav",JSON.stringify(fav));render()}[q,cat,city,type].forEach(x=>x.addEventListener("input",render));render();</script></body></html>
