name: Frontend Regression

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/test_frontend.py"
      - ".github/workflows/frontend-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run frontend smoke and helper regression tests
        run: python scripts/test_frontend.py
