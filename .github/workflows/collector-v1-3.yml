name: public-source-collector
on:
  push:
    paths:
      - ".github/workflows/collector-v1-3.yml"
      - "scripts/collect_public_sources.py"
      - "scripts/publish_collected_jobs.py"
      - "scripts/verify_job_links.py"
      - "scripts/quality_rules.py"
      - "scripts/finalize_job_quality.py"
      - "scripts/test_job_quality.py"
      - "scripts/test_frontend.py"
      - "data/company_sources.json"
  workflow_dispatch:
  schedule:
    - cron: "45 */6 * * *"
permissions:
  contents: write
concurrency:
  group: job-data-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sync with latest main before collecting
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Parser and classification regression tests
        run: python scripts/test_job_quality.py
      - name: Frontend syntax and interaction smoke tests
        run: python scripts/test_frontend.py
      - name: Collect V3 public official sources
        run: python scripts/collect_public_sources.py
      - name: Merge collected records
        run: python scripts/publish_collected_jobs.py
      - name: Validate
        run: python scripts/validate_jobs.py
      - name: Deduplicate
        run: python scripts/dedupe_jobs.py
      - name: Verify rotating batch of direct job links
        run: python scripts/verify_job_links.py
      - name: Recalculate priority vs. lead buckets after verification
        run: python scripts/finalize_job_quality.py
      - name: Quality summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/collection-manifest.json",encoding="utf-8"))
          print("COLLECTION QUALITY:", json.dumps({k:d.get(k) for k in ["enabled_sources","records_found","active_candidates","pending_review"]},ensure_ascii=False))
          PY
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.inbox.json data/jobs.json data/collection-manifest.json data/collection-state.json data/verification-state.json data/verification-manifest.json
          git diff --cached --quiet || git commit -m "chore: collect verified 2027 campus jobs v3"
          git push
