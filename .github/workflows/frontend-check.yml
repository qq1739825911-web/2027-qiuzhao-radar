name: Frontend Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/test_frontend.py"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    paths:
      - "index.html"
      - "scripts/test_frontend.py"
      - ".github/workflows/frontend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate page structure and control hooks
        run: python scripts/test_frontend.py
