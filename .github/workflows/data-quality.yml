name: V1.2 Data Quality

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_sources.py"
      - ".github/workflows/data-quality.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: job-data-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parser and classification regression tests
        run: python scripts/test_job_quality.py

      - name: Validate normalized job data
        run: python scripts/validate_jobs.py

      - name: Deduplicate
        run: python scripts/dedupe_jobs.py

      - name: Expire closed jobs
        run: python scripts/expire_jobs.py

      - name: Check public source entry points
        run: python scripts/check_sources.py

      - name: Commit data maintenance
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data maintenance changes."
            exit 0
          fi
          git config user.name "2027-qiuzhao-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/source-health.json
          git commit -m "chore: maintain normalized job data"
          git push
